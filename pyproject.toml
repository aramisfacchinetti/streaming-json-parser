[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-json-parser"
version = "0.2.3"
authors = [
    { name = "Aramis Facchinetti", email = "aramis.facchinetti16@gmail.com" },
]
description = "High-performance JSON decoding and true incremental parsing for Python streams."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
keywords = ["streaming", "json", "parser", "llm", "large language model", "incremental parsing"]

# dependencies = [
#     "some-package>=1.0",
# ]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "msgspec>=0.18",
    "pydantic-core>=2.0",
    "jiter>=0.12",
]
typecheck = [
    "pyright>=1.1",
]
quality = [
    "pytest-cov>=7.1.0",
    "ruff>=0.14.0",
]
accelerated = [
    "msgspec>=0.18",
    "orjson>=3.9",
    "pysimdjson>=5",
    "ujson>=5",
    "python-rapidjson>=1.23",
    "yyjson>=4",
]
partial = [
    "pydantic-core>=2.0",
    "jiter>=0.12",
]
benchmark = [
    "ijson>=3.3",
    "partial-json-parser>=0.2",
    "partialjson>=1.1",
    "json-repair>=0.63",
    "jsonriver>=1.0",
    "untruncate-json>=1.1",
    "ujson>=5",
    "python-rapidjson>=1.23",
    "yyjson>=4",
    "pydantic-core>=2.0",
    "jiter>=0.12",
]
native-build = [
    "maturin>=1,<2",
]

[project.urls]
Homepage = "https://github.com/aramisfacchinetti/streaming-json-parser"
Repository = "https://github.com/aramisfacchinetti/streaming-json-parser"
Issues = "https://github.com/aramisfacchinetti/streaming-json-parser/issues"
Changelog = "https://github.com/aramisfacchinetti/streaming-json-parser/blob/main/CHANGELOG.md"
Contributing = "https://github.com/aramisfacchinetti/streaming-json-parser/blob/main/CONTRIBUTING.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["streaming_json_parser*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
streaming_json_parser = ["py.typed", "*.pyi"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length and lambda style are left to maintainers; this PR does not adopt formatting.
ignore = ["E501", "E731"]

[tool.ruff.lint.per-file-ignores]
# These scripts add the checkout source to sys.path before first-party imports.
"scripts/benchmark_incremental.py" = ["E402"]
"scripts/benchmark_ndjson_strategy_matrix.py" = ["E402"]
"scripts/benchmark_parser.py" = ["E402"]
# The lambdas are consumed inside the current chunk-size iteration.
"scripts/benchmark_partial_parser.py" = ["E402", "B023"]
"scripts/benchmark_partial_strategy_matrix.py" = ["E402"]
"scripts/benchmark_strategy_matrix.py" = ["E402"]
# Native-only tests skip the module before importing the package when the extension is absent.
"tests/test_native_incremental.py" = ["E402"]
# Preserve the grouped typed re-exports instead of expanding them into one import per symbol.
"src/streaming_json_parser/__init__.pyi" = ["I001"]

[tool.coverage.run]
branch = true
source = ["streaming_json_parser"]

[tool.coverage.report]
fail_under = 68.0
precision = 1
show_missing = true
