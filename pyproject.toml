[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-json-parser"
version = "0.2.1"
authors = [
    { name = "Aramis Facchinetti", email = "aramis.facchinetti16@gmail.com" },
]
description = "High-performance JSON decoding and true incremental parsing for Python streams."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
keywords = ["streaming", "json", "parser", "llm", "large language model", "incremental parsing"]

# dependencies = [
#     "some-package>=1.0",
# ]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "msgspec>=0.18",
    "pydantic-core>=2.0",
    "jiter>=0.12",
]
accelerated = [
    "msgspec>=0.18",
    "orjson>=3.9",
    "pysimdjson>=5",
    "ujson>=5",
    "python-rapidjson>=1.23",
    "yyjson>=4",
]
partial = [
    "pydantic-core>=2.0",
    "jiter>=0.12",
]
benchmark = [
    "ijson>=3.3",
    "partial-json-parser>=0.2",
    "partialjson>=1.1",
    "json-repair>=0.63",
    "jsonriver>=1.0",
    "untruncate-json>=1.1",
    "ujson>=5",
    "python-rapidjson>=1.23",
    "yyjson>=4",
    "pydantic-core>=2.0",
    "jiter>=0.12",
]
native-build = [
    "maturin>=1,<2",
]

[project.urls]
Homepage = "https://github.com/aramisfacchinetti/streaming-json-parser"
Repository = "https://github.com/aramisfacchinetti/streaming-json-parser"
Issues = "https://github.com/aramisfacchinetti/streaming-json-parser/issues"
Changelog = "https://github.com/aramisfacchinetti/streaming-json-parser/blob/main/CHANGELOG.md"
Contributing = "https://github.com/aramisfacchinetti/streaming-json-parser/blob/main/CONTRIBUTING.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["streaming_json_parser*"]
exclude = ["tests*"]
