<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="344" viewBox="0 0 1160 344" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Complete JSON decoding</title>
  <desc id="chart-description">Complete JSON decoding. Horizontal bars show total process CPU time across each benchmark batch. All benchmark results are included and lower is better.</desc>
