name: Publish native package

on:
  pull_request:
  push:
    tags:
      - "native-v*"

permissions:
  contents: read

jobs:
  native-quality:
    name: Rust quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust_native/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path rust_native/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path rust_native/Cargo.toml --locked

  build-linux-x86_64:
    name: Build Linux x86_64 wheel and source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install test dependencies
        run: python -m pip install --upgrade pip '.[test]'

      - name: Build manylinux wheel and source distribution
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.14.0
          manylinux: 2014
          command: build
          args: --release --locked --sdist --compatibility pypi -i python3.10 --manifest-path rust_native/Cargo.toml --out dist-native

      - name: Check package metadata
        run: python -m pip install --upgrade twine && python -m twine check dist-native/*

      - name: Install and test the source distribution
        run: python -m pip install --no-deps --no-binary=streaming-json-parser-native dist-native/*.tar.gz

      - name: Verify installed source distribution
        run: python -c "import importlib.metadata as m, pathlib, streaming_json_parser_native as n; p=pathlib.Path(n.__file__).resolve(); print(p); assert m.version('streaming-json-parser-native') == '0.2.2'; assert 'site-packages' in str(p)"

      - name: Run Python tests with the source-built extension
        run: python -m pytest -q

      - name: Save Linux x86_64 distributions
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x86_64
          path: dist-native/*
          if-no-files-found: error
          retention-days: 7

  build-linux-aarch64:
    name: Build Linux arm64 wheel
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.14.0
          target: aarch64-unknown-linux-gnu
          manylinux: 2014
          command: build
          args: --release --locked --compatibility pypi -i python3.10 --manifest-path rust_native/Cargo.toml --out dist-native

      - name: Save Linux arm64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-aarch64
          path: dist-native/*.whl
          if-no-files-found: error
          retention-days: 7

  build-windows-x86_64:
    name: Build Windows x86_64 wheel
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install Maturin
        run: python -m pip install --upgrade pip 'maturin==1.14.0'

      - name: Build Windows wheel
        run: maturin build --release --locked --interpreter python --manifest-path rust_native/Cargo.toml --out dist-native

      - name: Save Windows x86_64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-x86_64
          path: dist-native/*.whl
          if-no-files-found: error
          retention-days: 7

  build-macos-arm64:
    name: Build macOS arm64 wheel
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install Maturin
        run: python -m pip install --upgrade pip 'maturin==1.14.0'

      - name: Build macOS wheel
        run: maturin build --release --locked --interpreter python --manifest-path rust_native/Cargo.toml --out dist-native

      - name: Save macOS arm64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-arm64
          path: dist-native/*.whl
          if-no-files-found: error
          retention-days: 7

  test-wheels:
    name: Test ${{ matrix.target }} on Python ${{ matrix.python-version }}
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
      - build-windows-x86_64
      - build-macos-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        target: [linux-x86_64, linux-aarch64, windows-x86_64, macos-arm64]
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            artifact: native-linux-x86_64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            artifact: native-linux-aarch64
          - target: windows-x86_64
            runner: windows-2025
            artifact: native-windows-x86_64
          - target: macos-arm64
            runner: macos-15
            artifact: native-macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core and test dependencies
        run: python -m pip install --upgrade pip -e '.[test]'

      - name: Download platform wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-native

      - name: Install only the built binary wheel
        run: "python -m pip install --only-binary=:all: --no-deps dist-native/*.whl"

      - name: Verify installed wheel provenance
        run: python -c "import importlib.metadata as m, pathlib, streaming_json_parser_native as n; p=pathlib.Path(n.__file__).resolve(); print(p); assert m.version('streaming-json-parser-native') == '0.2.2'; assert 'site-packages' in str(p)"

      - name: Run Python tests with the native wheel
        run: python -m pytest -q

  publish:
    name: Publish to PyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/native-v') }}
    needs:
      - native-quality
      - build-linux-x86_64
      - build-linux-aarch64
      - build-windows-x86_64
      - build-macos-arm64
      - test-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Linux x86_64 wheel and source distribution
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: dist-native

      - name: Download Linux arm64 wheel
        uses: actions/download-artifact@v4
        with:
          name: native-linux-aarch64
          path: dist-native

      - name: Download Windows x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: native-windows-x86_64
          path: dist-native

      - name: Download macOS arm64 wheel
        uses: actions/download-artifact@v4
        with:
          name: native-macos-arm64
          path: dist-native

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release artifacts
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from email import message_from_bytes
          from pathlib import Path

          files = list(Path("dist-native").iterdir())
          wheels = [path for path in files if path.suffix == ".whl"]
          sdists = [path for path in files if path.name.endswith(".tar.gz")]
          assert len(wheels) == 4, f"expected four wheels, got: {wheels}"
          assert len(sdists) == 1, f"expected one source distribution, got: {sdists}"
          assert all("-cp310-abi3-" in path.name for path in wheels), wheels
          required_platform_tags = (
              "manylinux2014_x86_64",
              "manylinux2014_aarch64",
              "win_amd64",
              "macosx_11_0_arm64",
          )
          for tag in required_platform_tags:
              assert any(tag in path.name for path in wheels), f"missing {tag}: {wheels}"

          wheel_versions = set()
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  metadata_path = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
                  metadata = message_from_bytes(archive.read(metadata_path))
                  wheel_versions.add(metadata["Version"])
          assert len(wheel_versions) == 1, f"wheel version mismatch: {wheel_versions}"
          version = next(iter(wheel_versions))

          with tarfile.open(sdists[0], "r:gz") as archive:
              pkg_info_path = next(member for member in archive.getmembers() if member.name.endswith("/PKG-INFO"))
              pkg_info = message_from_bytes(archive.extractfile(pkg_info_path).read())
          assert pkg_info["Version"] == version, f"sdist version {pkg_info['Version']} != wheel version {version}"
          assert os.environ["GITHUB_REF_NAME"] == f"native-v{version}", (
              f"release tag {os.environ['GITHUB_REF_NAME']} does not match package version {version}"
          )
          PY
          python -m pip install --upgrade twine
          python -m twine check dist-native/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-native
